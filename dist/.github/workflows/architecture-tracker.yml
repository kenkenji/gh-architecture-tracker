name: Architecture Tracker

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
  issue_comment:
    types: [edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "検出対象のPR番号（手動実行時）"
        required: true

concurrency:
  group: architecture-tracker-data
  cancel-in-progress: false

jobs:
  detect-changes:
    if: >-
      (github.event_name == 'pull_request'
       && github.event.pull_request.merged == true)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proposals: ${{ steps.detect-action.outputs.proposals }}
      proposal-count: ${{ steps.detect-action.outputs.proposal-count }}
      detection-method: ${{ steps.detect-action.outputs.detection-method }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Installation Token
        id: app-token
        if: ${{ vars.APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Fetch config from data branch
        id: config
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          config_yaml=$(gh api "repos/${REPO}/contents/config.yaml?ref=_architecture-tracker" \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
          if [ -n "$config_yaml" ]; then
            model=$(echo "$config_yaml" | grep -A1 '^llm:' | grep 'model:' | sed 's/.*model:[[:space:]]*//' | sed 's/[[:space:]]*#.*//' | tr -d '[:space:]')
            echo "model=${model}" >> "$GITHUB_OUTPUT"
          else
            echo "model=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect model changes
        id: detect-action
        uses: ./.github/actions/detect-model-changes
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker
          pr-number: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.config.outputs.model }}

  post-comment:
    if: >-
      !failure() && !cancelled()
      && ((github.event_name == 'pull_request_review'
       && github.event.review.state == 'approved')
      || (github.event_name == 'pull_request'
       && github.event.pull_request.merged == true)
      || github.event_name == 'workflow_dispatch')
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Installation Token
        id: app-token
        if: ${{ vars.APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Fetch config from data branch
        id: config
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          config_yaml=$(gh api "repos/${REPO}/contents/config.yaml?ref=_architecture-tracker" \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo "")
          if [ -n "$config_yaml" ]; then
            model=$(echo "$config_yaml" | grep -A1 '^llm:' | grep 'model:' | sed 's/.*model:[[:space:]]*//' | sed 's/[[:space:]]*#.*//' | tr -d '[:space:]')
            echo "model=${model}" >> "$GITHUB_OUTPUT"
            spa_url=$(echo "$config_yaml" | grep -A1 '^spa:' | grep 'url:' | sed 's/.*url:[[:space:]]*//' | sed 's/[[:space:]]*#.*//' | tr -d '[:space:]' | sed 's/^"\(.*\)"$/\1/' | sed "s/^'\(.*\)'$/\1/")
            echo "spa_url=${spa_url}" >> "$GITHUB_OUTPUT"
          else
            echo "model=" >> "$GITHUB_OUTPUT"
            echo "spa_url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch PR info for workflow_dispatch
        id: pr-info
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.inputs.pr-number }}
        run: |
          set -euo pipefail
          pr_title=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.title')
          echo "pr_title=${pr_title}" >> "$GITHUB_OUTPUT"

      - name: Track architecture
        uses: ./.github/actions/track-architecture
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.config.outputs.model }}
          proposals: ${{ needs.detect-changes.outputs.proposals }}
          detection-method: ${{ needs.detect-changes.outputs.detection-method }}
          spa-url: ${{ steps.config.outputs.spa_url }}
          pr-number: ${{ github.event.inputs.pr-number }}
          pr-title: ${{ steps.pr-info.outputs.pr_title }}

  merge-catchup:
    if: >-
      !failure() && !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
    needs: post-comment
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Installation Token
        id: app-token
        if: ${{ vars.APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Catch up pre-merge selections
        id: catchup
        uses: ./.github/actions/catch-up-mapping
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker

      - name: Generate Mermaid diagrams
        if: steps.catchup.outputs.recorded == 'true'
        uses: ./.github/actions/generate-mermaid
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker
          pr-number: ${{ github.event.pull_request.number }}

      - name: Bump model version after mapping recorded
        if: steps.catchup.outputs.recorded == 'true'
        uses: ./.github/actions/bump-model-version
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker
          trigger-type: pr
          trigger-pr-number: ${{ github.event.pull_request.number }}
          trigger-pr-url: ${{ github.event.pull_request.html_url }}
          author: ${{ github.event.pull_request.user.login }}

  record-mapping:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.action == 'edited'
      && github.event.issue.pull_request
      && contains(github.event.comment.body, '🏗 Architecture Tracker')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Installation Token
        id: app-token
        if: ${{ vars.APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Record mapping
        id: record
        uses: ./.github/actions/record-mapping
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker

      - name: Generate Mermaid diagrams
        if: steps.record.outputs.skipped != 'true'
        uses: ./.github/actions/generate-mermaid
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker
          pr-number: ${{ github.event.issue.number }}

      - name: Bump model version after mapping recorded
        if: steps.record.outputs.skipped != 'true'
        uses: ./.github/actions/bump-model-version
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          data-branch: _architecture-tracker
          trigger-type: pr
          trigger-pr-number: ${{ github.event.issue.number }}
          trigger-pr-url: ${{ github.event.issue.html_url }}
          author: ${{ github.event.sender.login }}
