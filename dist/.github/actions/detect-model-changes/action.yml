name: "Detect Model Changes"
description: "PRの変更ファイルからアーキテクチャモデルの変更を検出し、提案コメントを投稿する"

inputs:
  github-token:
    description: "GitHub token for API access"
    required: true
  data-branch:
    description: "Branch name where architecture data is stored"
    required: true
    default: "_architecture-tracker"
  pr-number:
    description: "PR number to analyze"
    required: true
  anthropic-api-key:
    description: "Anthropic API key for Claude"
    required: false
    default: ""
  openai-api-key:
    description: "OpenAI API key for GPT"
    required: false
    default: ""
  claude-code-oauth-token:
    description: "Claude Code OAuth token for CLI-based analysis"
    required: false
    default: ""
  model:
    description: "LLM model name (default: provider's standard model)"
    required: false
    default: ""

outputs:
  proposals:
    description: "Detected change proposals as JSON array"
    value: ${{ steps.detect.outputs.proposals }}
  proposal-count:
    description: "Number of proposals detected"
    value: ${{ steps.detect.outputs.proposal_count }}
  comment-posted:
    description: "Whether a proposal comment was posted"
    value: ${{ steps.post.outputs.comment_posted || steps.no-comment.outputs.comment_posted || 'false' }}
  detection-method:
    description: "Detection method used (static or static+llm)"
    value: ${{ steps.detect.outputs.detection_method }}

runs:
  using: "composite"
  steps:
    - name: Setup Python dependencies
      shell: bash
      run: pip install "pyyaml>=6,<7" "anthropic>=0.39,<1" "openai>=1,<2"

    - name: Install Claude Code CLI
      if: inputs.claude-code-oauth-token != '' && inputs.anthropic-api-key == '' && inputs.openai-api-key == ''
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Fetch components.yaml
      id: fetch-components
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DATA_BRANCH: ${{ inputs.data-branch }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        echo "Fetching components.yaml from branch: ${DATA_BRANCH}"
        components_yaml=$(gh api "repos/${REPO}/contents/components.yaml?ref=${DATA_BRANCH}" \
          --jq '.content' | base64 -d)

        if [ -z "$components_yaml" ]; then
          echo "::error::components.yaml not found on branch ${DATA_BRANCH}"
          exit 1
        fi

        components_file=$(mktemp --suffix=.yaml)
        echo "$components_yaml" > "$components_file"
        echo "components_file=${components_file}" >> "$GITHUB_OUTPUT"

    - name: Fetch PR changed files
      id: fetch-files
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        set -euo pipefail

        pr_files_file=$(mktemp --suffix=.json)
        gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
          --jq '[.[] | {filename, status, additions, deletions, changes}]' \
          > "$pr_files_file"

        file_count=$(python3 -c "import json; print(len(json.load(open('$pr_files_file'))))")
        echo "Fetched ${file_count} changed files for PR #${PR_NUMBER}"
        echo "pr_files_file=${pr_files_file}" >> "$GITHUB_OUTPUT"

    - name: Fetch PR body
      id: fetch-body
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_BODY_EVENT: ${{ github.event.pull_request.body }}
      run: |
        set -euo pipefail
        pr_body_file=$(mktemp --suffix=.txt)
        if [ -n "$PR_BODY_EVENT" ]; then
          printf '%s' "$PR_BODY_EVENT" > "$pr_body_file"
        else
          gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' > "$pr_body_file"
        fi
        echo "pr_body_file=${pr_body_file}" >> "$GITHUB_OUTPUT"

    - name: Detect model changes
      id: detect
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        MODEL: ${{ inputs.model }}
        COMPONENTS_FILE: ${{ steps.fetch-components.outputs.components_file }}
        PR_FILES_FILE: ${{ steps.fetch-files.outputs.pr_files_file }}
        PR_BODY_FILE: ${{ steps.fetch-body.outputs.pr_body_file }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        model_args=()
        if [ -n "$MODEL" ]; then
          model_args=(--model "$MODEL")
        fi

        result=$(python3 "${ACTION_PATH}/detect_changes.py" \
          --pr-files "$PR_FILES_FILE" \
          --pr-body-file "$PR_BODY_FILE" \
          --components-file "$COMPONENTS_FILE" \
          --prompt-template "${ACTION_PATH}/prompt.txt" \
          --mode full \
          "${model_args[@]}")

        proposals=$(echo "$result" | python3 -c "import sys, json; d=json.load(sys.stdin); print(json.dumps(d.get('proposals', [])))")
        proposal_count=$(echo "$proposals" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
        detection_method=$(echo "$result" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('detection_method', 'static'))")

        {
          echo "proposals<<GHEOF_DETECT_END"
          echo "${proposals}"
          echo "GHEOF_DETECT_END"
        } >> "$GITHUB_OUTPUT"
        echo "proposal_count=${proposal_count}" >> "$GITHUB_OUTPUT"
        echo "detection_method=${detection_method}" >> "$GITHUB_OUTPUT"

        echo "✅ Detection complete: ${proposal_count} proposal(s) found (method: ${detection_method})"

    - name: Post proposal comment
      id: post
      if: steps.detect.outputs.proposal_count != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PROPOSALS: ${{ steps.detect.outputs.proposals }}
        DETECTION_METHOD: ${{ steps.detect.outputs.detection_method }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        comment_file=$(mktemp --suffix=.md)
        proposals_file=$(mktemp --suffix=.json)
        echo "$PROPOSALS" > "$proposals_file"

        python3 "${ACTION_PATH}/build_proposal_comment.py" \
          --proposals "$proposals_file" \
          --pr-number "$PR_NUMBER" \
          --detection-method "$DETECTION_METHOD" \
          --output-file "$comment_file"

        # 既存のModel Change Proposalsコメントを検索
        existing_comment_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '[.[] | select(.body | contains("## 🔄 Model Change Proposals"))] | .[0].id // empty' \
          2>/dev/null || echo "")

        if [ -n "$existing_comment_id" ]; then
          gh api "repos/${REPO}/issues/comments/${existing_comment_id}" \
            -X PATCH --field body=@"$comment_file"
          echo "✅ Updated existing proposal comment (id: ${existing_comment_id})"
        else
          gh pr comment "$PR_NUMBER" --body-file "$comment_file" --repo "$REPO"
          echo "✅ Posted new proposal comment on PR #${PR_NUMBER}"
        fi

        echo "comment_posted=true" >> "$GITHUB_OUTPUT"
        rm -f "$comment_file" "$proposals_file"

    - name: Set no-comment output
      id: no-comment
      if: steps.detect.outputs.proposal_count == '0'
      shell: bash
      run: |
        echo "No proposals detected, skipping comment."
        echo "comment_posted=false" >> "$GITHUB_OUTPUT"

    - name: Cleanup
      if: always()
      shell: bash
      env:
        COMPONENTS_FILE: ${{ steps.fetch-components.outputs.components_file }}
        PR_FILES_FILE: ${{ steps.fetch-files.outputs.pr_files_file }}
        PR_BODY_FILE: ${{ steps.fetch-body.outputs.pr_body_file }}
      run: rm -f "$COMPONENTS_FILE" "$PR_FILES_FILE" "$PR_BODY_FILE"
